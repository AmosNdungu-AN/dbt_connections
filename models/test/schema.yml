version: 2

models:
  - name: customers
    description: One record per customer
    columns:
      - name: customer_id
        description: Primary key
        data_tests:
          - not_null
          - unique
      - name: first_order_date
        description: NULL when a customer has not placed an order.
          
  - name: stg_customers
    description: this model cleans up customer data
    columns:
      - name: customer_id
        description: primary key
        data_tests:
          - unique
          - not_null
          
  - name: stg_orders
    description: this model cleans up order data
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
             arguments:
              values: ['placed','shipped', 'completed', 'return_pending', 'returned']
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id 

              
          
          
          