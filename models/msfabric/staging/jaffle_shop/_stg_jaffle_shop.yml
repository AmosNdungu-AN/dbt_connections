version: 2

models:
  - name: stg_jaffle_shop__customers
    description: the grain of this table is one unique customer per row.
    columns:
      - name: customer_id
        description: this is the primary key for the customers table
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id        
          
  - name: stg_jaffle_shop__orders
    description: the grain is one order per raw
    columns:
      - name: order_id
        description: primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
             values: ['placed','shipped', 'completed', 'return_pending', 'returned']
        
          
  - name: stg_jaffle_shop__payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
          
