version: 2

models:
  - name: stg_jaffle_shop__customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id        
          
  - name: stg_jaffle_shop__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
             values: ['placed','shipped', 'completed', 'return_pending', 'returned']
        
          
  - name: stg_jaffle_shop__payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
          
